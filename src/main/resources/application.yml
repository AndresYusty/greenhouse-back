# Configuración principal de Spring Boot.

spring:
  application:
    name: invernadero-api
  profiles:
    # Si no defines SPRING_PROFILES_ACTIVE: MySQL local (application-local.yml) + Google OAuth.
    # Solo demo sin pantalla de login: SPRING_PROFILES_ACTIVE=local
    # CI: SPRING_PROFILES_ACTIVE=default
    default:
      - local
      - oauth
  datasource:
    # Solo MySQL. Local: sin MYSQLHOST usa localhost + MYSQL_USER / MYSQL_PASSWORD / MYSQL_DATABASE.
    # Railway (plugin MySQL): define MYSQLHOST, MYSQLPORT, MYSQLUSER, MYSQLPASSWORD, MYSQLDATABASE
    # (Railway también expone MYSQL_* con guiones bajos; ambos están soportados en la URL y credenciales).
    # Opcional: una sola URL con variable de Referencia ⇢ SPRING_DATASOURCE_URL.
    url: jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:${MYSQL_DATABASE:invernadero_db}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USER:root}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:}}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  messages:
    basename: messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  # En PaaS (p. ej. Railway) debe coincidir con la variable PORT del contenedor (por defecto 8081 local).
  port: ${PORT:8081}
  servlet:
    session:
      cookie:
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  sample-data:
    enabled: true
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  security:
    oauth2-enabled: ${APP_OAUTH2_ENABLED:false}
  oauth2:
    post-login-redirect: ${APP_OAUTH2_POST_LOGIN:http://localhost:5173/panel}
  taiga:
    base-url: ${TAIGA_BASE_URL:https://api.taiga.io/api/v1}
    personal-access-token: ${TAIGA_TOKEN:}
