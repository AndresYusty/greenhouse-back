# Se activa por defecto junto a `local` (spring.profiles.default). Opt-out: SPRING_PROFILES_ACTIVE=local
# En Railway u otro hosting: definir GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET en las variables del servicio backend.
spring:
  config.activate.on-profile: oauth
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
redirect-uri: "${APP_OAUTH2_REDIRECT_URI:http://localhost:8081/login/oauth2/code/google}"
app:
  security:
    oauth2-enabled: true
